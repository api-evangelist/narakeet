- aid: narakeet:narakeet-text-to-speech-api
  name: Narakeet Text to Speech API
  tags:
  - Text to Speech
  - TTS
  - Audio
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://www.narakeet.com/docs/automating/text-to-speech-api/
  baseURL: https://api.narakeet.com
  properties:
  - url: https://www.narakeet.com/docs/automating/text-to-speech-api/
    type: Documentation
  - url: https://www.narakeet.com/docs/automating/text-to-speech-api/
    type: APIReference
  - url: openapi/narakeet-openapi.yml
    type: OpenAPI
  - url: collections/narakeet.postman_collection.json
    type: PostmanCollection
  - url: collections/narakeet.opencollection.json
    type: OpenCollection
  description: Convert text, SubRip, or WebVTT input into narrated audio in MP3, M4A,
    or WAV. Runs as a short-content streaming call (returns audio bytes directly,
    ~1 KB input) or a long-content asynchronous build (returns a status URL to poll,
    ~1024 KB input). Voice, speed, and volume are set via query parameters, with
    batch and subtitle output modes selected by the Accept header.
- aid: narakeet:narakeet-video-api
  name: Narakeet Markdown to Video API
  tags:
  - Video
  - Markdown
  - Media Generation
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://www.narakeet.com/docs/automating/video-api/
  baseURL: https://api.narakeet.com
  properties:
  - url: https://www.narakeet.com/docs/automating/video-api/
    type: Documentation
  - url: https://www.narakeet.com/docs/automating/video-api/
    type: APIReference
  - url: openapi/narakeet-openapi.yml
    type: OpenAPI
  - url: collections/narakeet.postman_collection.json
    type: PostmanCollection
  - url: collections/narakeet.opencollection.json
    type: OpenCollection
  description: Build narrated video from a Markdown or text script plus its assets.
    Request a pre-signed upload token, PUT a zip archive of the script and media,
    trigger an asynchronous build, then poll the returned status URL for the finished
    video and poster image.
