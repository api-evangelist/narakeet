name: Narakeet
kind: company
description: Narakeet turns text and Markdown scripts into realistic narrated audio
  and video using AI text-to-speech voices - 900 voices across 100 languages. Beyond
  its web app, Narakeet exposes a documented REST API (base https://api.narakeet.com)
  for building speech audio (MP3, M4A, WAV) from text, building video from Markdown
  scripts and assets, listing available voices, and checking account credits. Audio
  builds run either as a short-content streaming call that returns bytes directly or
  as a long-content asynchronous build that returns a status URL to poll; video
  builds always upload a zip, trigger a build, and poll for the finished MP4. All
  build requests authenticate with an x-api-key header, and API access requires a
  top-up or metered commercial account.
