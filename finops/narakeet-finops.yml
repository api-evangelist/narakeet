description: >-
  FinOps view of Narakeet spend. Narakeet bills on the duration of audio and
  video produced, drawn down from prepaid top-up credits (or a metered
  commercial plan) that never expire. The confirmed entry rate is roughly $0.20
  per minute (6 USD for 30 minutes), falling toward roughly $0.05 per minute on
  the largest packs. The same duration-based credits are consumed whether output
  is produced through the web app or the API. The voice-listing and
  account-credits API endpoints consume no credits but do count against the daily
  request quota. The dominant cost driver is total minutes of audio/video
  generated, so cost control means managing script length, avoiding unnecessary
  re-builds, and buying larger packs to lower the per-minute rate.
notes: >-
  Exact per-unit rates above the confirmed entry pack are not reconciled here;
  verify on the Narakeet pricing page. Use the Account Credits API
  (GET /account/credits, creditSeconds) to monitor remaining balance
  programmatically and gate jobs before starting long builds.
