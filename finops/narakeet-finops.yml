meters:
- name: audio_minutes
  description: Minutes of narrated audio produced via the text-to-speech API or web app, drawn from credits.
  unit: minutes
  aggregation: sum
  dimensions:
  - account
  - voice
  - language
- name: video_minutes
  description: Minutes of video produced via the Markdown-to-video build, drawn from credits.
  unit: minutes
  aggregation: sum
  dimensions:
  - account
  - project
- name: credit_seconds
  description: Prepaid credit seconds remaining on the account, reported by the Account Credits API.
  unit: seconds
  aggregation: last
  dimensions:
  - account
  - plan
- name: api_requests
  description: API requests made against the daily quota (including no-cost voices and credits calls).
  unit: requests
  aggregation: sum
  dimensions:
  - account
  - endpoint
principles:
- name: Visibility
  description: Track audio and video minutes produced per account, voice, and project, and poll the Account Credits API to watch the remaining credit balance.
- name: Allocation
  description: Separate API keys or accounts per team/product so production minutes map to internal cost centers.
- name: Optimization
  description: Trim script length, cache and reuse generated audio/video instead of rebuilding, cache the voice list, and buy larger credit packs to lower the per-minute rate.
- name: Accountability
  description: Assign an owner per account/key and reconcile monthly minutes produced against purchased credits before topping up.
